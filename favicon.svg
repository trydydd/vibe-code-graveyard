<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#0a0a0a" rx="4"/>
  <g fill="#ee3323">
    <!-- skull head -->
    <circle cx="16" cy="14" r="8"/>
    <!-- eyes -->
    <circle cx="12" cy="13" r="2.2" fill="#0a0a0a"/>
    <circle cx="20" cy="13" r="2.2" fill="#0a0a0a"/>
    <!-- nose -->
    <polygon points="16,16 15,18 17,18"/>
    <!-- jaw -->
    <rect x="11" y="20" width="10" height="5" rx="2"/>
    <!-- teeth -->
    <rect x="12.5" y="21" width="1.5" height="2.5" fill="#0a0a0a" rx="0.3"/>
    <rect x="15.2" y="21" width="1.6" height="2.5" fill="#0a0a0a" rx="0.3"/>
    <rect x="18" y="21" width="1.5" height="2.5" fill="#0a0a0a" rx="0.3"/>
  </g>
</svg>
